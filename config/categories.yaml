categories:
  automation:
    description: >
      Technical automation engineering and implementation roles using workflow
      engines, RPA, low-code platforms, scripts, APIs, system integrations,
      orchestration tools and automated data flows rather than business process
      analysis or documentation.

  data:
    description: >
      Roles involving data engineering, ETL, data pipelines, databases, cloud data
      platforms and data integration.

  business_intelligence:
    description: >
      Roles involving reporting, dashboards, analytics, business intelligence,
      Power BI and data visualization.

  process_management:
    description: >
      Business process analyst, business analyst, workflow management and
      continuous improvement specialist roles in business process management
      (BPM), process design, process governance, process ownership, operational
      excellence and organizational process optimization.

  project_management:
    description: >
      Roles involving coordination and management of technical or digital projects,
      requirements, stakeholders and implementation.

  supply_chain:
    description: >
      Supply chain, logistics, procurement and planning roles focused on demand
      planning, supply planning, production planning, purchasing, fulfillment,
      forecasting, inventory, material planning and distribution.

  consulting:
    description: >
      Technology or business consulting focused on digitalization, IT, data,
      processes or automation.
