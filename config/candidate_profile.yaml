evaluation_guidance:
  candidate_fact_policy:
    - >
      Only information explicitly contained in this profile may be treated
      as factual candidate experience.
    - >
      Do not infer experience with a technology merely because it is related
      to another listed technology.
    - >
      If a required technology is not listed, classify it as unknown or missing.
  experience_rules:
    - >
      Distinguish mandatory professional-experience requirements from
      preferred or ideal experience.
    - >
      Entry-level and junior roles remain relevant even when first practical
      experience is requested.
    - >
      Requirements phrased as preferred, ideal or advantageous should not
      be treated like mandatory requirements.
  skill_rules:
    - >
      Distinguish must-have requirements from nice-to-have requirements.
    - >
      Missing nice-to-have skills should normally have a smaller impact than
      missing mandatory skills.
    - >
      Consider transferable experience where the technical concepts are
      clearly related, but do not claim direct experience that is not present
      in the candidate facts.
  evaluation_goal: >-
    Assess whether applying to the position is reasonable for an early-career
    candidate with practical experience in process automation, application
    development, data/reporting and generative-AI-supported workflows.
