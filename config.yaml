search:
  results_per_query: 50
  hours_old: 168

  locations:
    - city: "Karlsruhe"
      radius_km: 100
      country: "Germany"

  # Groups organize discovery and preserve the legacy API label. They are not
  # semantic categories and do not prove that a discovered job belongs to them.
  query_groups:
    - name: "AI & Data Engineering"
      queries:
        - "AI Engineer"
        - "ML Engineer"
        - "Data Scientist"
        - "Data Engineer"
        - "LLM Engineer"
        - "GenAI Developer"
        - "Machine Learning"
        - "Deep Learning"
        - "NLP Engineer"
        - "Computer Vision"
        - "MLOps"
        - "Prompt Engineer"
        - "AI Developer"
        - "KI Entwickler"

    - name: "Software Development"
      queries:
        - "Software Developer"
        - "Software Engineer"
        - "Backend Developer"
        - "Backend Engineer"
        - "Fullstack Developer"
        - "Full Stack Engineer"
        - "Python Developer"
        - "TypeScript Developer"
        - "API Developer"
        - "Cloud Engineer"
        - "DevOps Engineer"
        - "Platform Engineer"
        - "Automatisierung Entwickler"
        - "RPA Developer"

    - name: "Data & Analytics"
      queries:
        - "Data Analyst"
        - "Business Intelligence"
        - "BI Developer"
        - "Analytics Engineer"
        - "Data Platform"
        - "Data Warehouse"
        - "Reporting Analyst"

    - name: "IT Consulting & Business Interface"
