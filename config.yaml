    - name: "Sales & Business Development"
      queries:
        - "Sales Engineer"
        - "Technical Sales"
        - "Business Development"
        - "Account Manager Tech"
        - "Pre-Sales Consultant"
        - "Solution Sales"

    - name: "Marketing & Content"
      queries:
        - "Content Manager"
        - "Marketing Manager"
        - "Performance Marketing"
        - "Brand Manager"
