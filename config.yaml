  # whether a job survives discovery or hard filtering.
  role_terms:
    - points: 35
      terms: ["ai engineer", "ml engineer", "llm engineer", "genai developer", "ki entwickler", "ai developer", "prompt engineer", "mlops"]
    - points: 30
      terms: ["data scientist", "data engineer", "machine learning", "deep learning", "nlp engineer", "computer vision", "analytics engineer"]
    - points: 25
      terms: ["software engineer", "software developer", "backend developer", "backend engineer", "fullstack developer", "full stack engineer", "python developer", "typescript developer", "platform engineer"]
    - points: 22
      terms: ["data analyst", "bi developer", "business intelligence", "data warehouse", "data platform", "reporting analyst"]
    - points: 20
      terms: ["cloud engineer", "devops engineer", "rpa developer", "automatisierung entwickler", "api developer"]
    - points: 20
      terms: ["it consultant", "digitalisierungsmanager", "digitalization manager", "business analyst it", "implementation consultant"]
    - points: 18
      terms: ["iot developer", "mes entwickler", "industrie 4.0", "ot engineer", "digital factory", "smart manufacturing"]
    - points: 18
      terms: ["supply chain it", "logistik it", "wms developer", "warehouse management"]
    - points: 18
      terms: ["finance it", "controlling it", "financial analyst it", "fp&a analyst", "accounting software"]
    - points: 18
      terms: ["martech", "marketing technology", "e-commerce developer", "crm developer", "marketing automation", "growth engineer"]
