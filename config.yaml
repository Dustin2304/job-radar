    - points: 10
      terms: ["machine learning", "deep learning", "neural network", "pytorch", "tensorflow", "mlops", "hugging face"]
    - points: 8
      terms: ["python", "fastapi", "django", "flask"]
    - points: 8
      terms: ["typescript", "node.js", "react", "vue"]
    - points: 6
      terms: ["docker", "kubernetes", "azure", "aws", "gcp", "cloud"]
    - points: 6
