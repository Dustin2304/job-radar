search:
  results_per_query: 50
  hours_old: 168

  locations:
    - city: "Karlsruhe"
      radius_km: 100
      country: "Germany"

  # Groups organize discovery and preserve the legacy API label. They are not
  # semantic categories and do not prove that a discovered job belongs to them.
  query_groups:
    - name: "AI & Data Engineering"
      queries:
        - "AI Engineer"
        - "ML Engineer"
        - "Data Scientist"
        - "Data Engineer"
        - "LLM Engineer"
        - "GenAI Developer"
        - "Machine Learning"
        - "Deep Learning"
        - "NLP Engineer"
        - "Computer Vision"
        - "MLOps"
        - "Prompt Engineer"
        - "AI Developer"
        - "KI Entwickler"

    - name: "Software Development"
      queries:
        - "Software Developer"
        - "Software Engineer"
        - "Backend Developer"
        - "Backend Engineer"
        - "Fullstack Developer"
        - "Full Stack Engineer"
        - "Python Developer"
        - "TypeScript Developer"
        - "API Developer"
        - "Cloud Engineer"
        - "DevOps Engineer"
        - "Platform Engineer"
        - "Automatisierung Entwickler"
        - "RPA Developer"

    - name: "Data & Analytics"
      queries:
        - "Data Analyst"
        - "Business Intelligence"
        - "BI Developer"
        - "Analytics Engineer"
        - "Data Platform"
        - "Data Warehouse"
        - "Reporting Analyst"

    - name: "IT Consulting & Business Interface"
      queries:
        - "IT Consultant"
        - "Digitalisierungsmanager"
        - "Digitalization Manager"
        - "Business Analyst IT"
        - "Prozessberater IT"
        - "ERP Consultant Junior"
        - "SAP Junior"
        - "Implementation Consultant"
        - "Solution Architect Junior"
        - "IT Projektmanager Junior"

    - name: "IT & Production / IoT"
      queries:
        - "MES Entwickler"
        - "IoT Developer"
        - "Industrie 4.0"
        - "OT Engineer"
        - "Produktions IT"
        - "Manufacturing Engineer IT"
        - "Digital Factory"
        - "Smart Manufacturing"
        - "Automatisierungstechnik IT"

    - name: "IT & Supply Chain / Logistics"
      queries:
        - "Supply Chain IT"
        - "Logistik IT"
        - "Warehouse Management System"
        - "WMS Developer"
        - "ERP Logistik"
        - "Supply Chain Analyst"
        - "Demand Planning IT"

    - name: "IT & Finance / Controlling"
      queries:
        - "Finance IT"
        - "Controlling IT"
        - "Financial Analyst IT"
        - "Treasury IT"
        - "Accounting Software"
        - "FP&A Analyst"
        - "Revenue Operations"

    - name: "IT & Marketing / E-Commerce"
      queries:
        - "Marketing Technology"
        - "MarTech"
        - "E-Commerce Developer"
        - "Digital Marketing Analyst"
        - "Growth Engineer"
        - "CRM Developer"
        - "Marketing Automation"
        - "Web Analytics"

    - name: "Sales & Business Development"
      queries:
        - "Sales Engineer"
        - "Technical Sales"
        - "Business Development"
        - "Account Manager Tech"
        - "Pre-Sales Consultant"
        - "Solution Sales"

    - name: "Marketing & Content"
      queries:
        - "Content Manager"
        - "Marketing Manager"
        - "Performance Marketing"
        - "Brand Manager"
        - "Product Marketing"

    - name: "Logistics & Operations"
      queries:
        - "Logistics Manager Junior"
        - "Operations Analyst"
        - "Supply Chain Manager"
        - "Procurement Analyst"

hard_filters:
  # Project-specific additions only. Built-in high-confidence exclusions live
  # in api/filters.py and still return structured reasons.
  excluded_title_terms: []

signals:
  # Keywords are bounded evidence. They never gate discovery or hard filtering.
  technologies:
    - name: "python"
      terms: ["python"]
    - name: "power_automate"
      terms: ["power automate"]
    - name: "power_platform"
      terms: ["power platform"]
    - name: "n8n"
      terms: ["n8n"]
    - name: "azure"
      terms: ["azure"]
    - name: "sql"
      terms: ["sql", "postgresql"]
    - name: "rest_api"
      terms: ["rest api", "rest apis", "restful api", "restful apis"]
    - name: "etl"
      terms: ["etl"]
    - name: "power_bi"
      terms: ["power bi"]
    - name: "databricks"
      terms: ["databricks"]
    - name: "azure_data_factory"
      terms: ["azure data factory"]
    - name: "fastapi"
      terms: ["fastapi"]
    - name: "docker"
      terms: ["docker"]
    - name: "typescript"
      terms: ["typescript"]
    - name: "machine_learning"
      terms: ["machine learning", "mlops"]
    - name: "llm"
      terms: ["llm", "llms", "large language model", "large language models", "generative ai", "genai"]

  role_terms:
    - name: "automation"
      terms: ["automation", "automatisierung", "process automation", "workflow automation"]
    - name: "digitalization"
      terms: ["digitalization", "digitalisierung", "digital transformation"]
    - name: "data_engineering"
      terms: ["data engineer", "data engineering", "data pipeline"]
    - name: "business_intelligence"
      terms: ["business intelligence", "bi developer", "reporting", "dashboard"]
    - name: "process_analysis"
      terms: ["business process analyst", "process analysis", "prozessanalyse"]
    - name: "process_optimization"
      terms: ["process optimization", "process improvement", "prozessoptimierung"]
    - name: "technical_project"
      terms: ["technical project", "it project", "technical project management"]
    - name: "integration"
      terms: ["system integration", "api integration", "integration"]
    - name: "analytics"
      terms: ["analytics", "data analysis", "data analyst"]
    - name: "consulting"
      terms: ["consultant", "consulting", "beratung"]
    - name: "supply_chain"
      terms: ["supply chain", "logistics", "logistik"]

pre_score:
  seniority:
    max_score: 25
    explicit_junior_score: 25
    neutral_score: 17
    positive_title_terms: ["junior", "entry level", "entry-level", "graduate", "berufseinsteiger", "absolvent", "trainee"]

  technologies:
    max_score: 30
    points_per_match: 5

  role:
    max_score: 25
    title_points_per_match: 6
    description_points_per_match: 3

  location:
    max_score: 20
    preferred_location_terms: ["karlsruhe"]
    remote_terms: ["remote", "homeoffice", "home office"]
    hybrid_terms: ["hybrid", "hybride", "mobiles arbeiten"]
    remote_score: 20
    preferred_hybrid_score: 20
    preferred_onsite_score: 17
    other_hybrid_score: 10
    other_onsite_score: 5
    unknown_score: 10

# Optional watchlist metadata. Career preference is intentionally not part of V2.4.
companies: []
